services:
  - type: web
    name: votogram
    runtime: go
    plan: free
    region: singapore
    buildCommand: go build -o votogram .
    preDeployCommand: ./votogram migrate
    startCommand: ./votogram
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: votogram-db
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: disable
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: votogram-db
    plan: free
    region: singapore
    databaseName: votogram
    user: votogram
