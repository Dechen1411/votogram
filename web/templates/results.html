<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votogram - Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/results.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="/home" class="logo-h">
                    <i class="fas fa-check-to-slot"></i>
                    Votogram
                </a>
                <div class="auth-links-h">
                    <a href="/profile">Profile</a>
                    <a href="/results">Results</a>
                    <a href="/logout" class="btn">Logout</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="results-page">
        <section class="results-shell">
            <div class="results-heading">
                <span class="eyebrow">Tally board</span>
                <h1 id="page-title">Poll Results</h1>
                <p>Closed polls appear here. Open a poll to review its final vote count.</p>
            </div>
            <div id="polls-list"></div>
            <div id="results-container"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>Gyalpozhing College of Information Technology, Kabesa</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const urlParams = new URLSearchParams(window.location.search);
            const pollID = urlParams.get('id');
            const pollsList = document.getElementById('polls-list');
            const resultsContainer = document.getElementById('results-container');

            const dateOptions = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZone: 'Asia/Dhaka'
            };

            function showLoading(element, message) {
                element.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> ${message}</div>`;
            }

            function formatDate(value) {
                return new Date(value + 'Z').toLocaleString('en-US', dateOptions);
            }

            function pollCard(poll) {
                const formattedExpiry = formatDate(poll.expires_at);
                return `
                    <a href="/results?id=${poll.id}" class="poll-link">
                        <span>
                            <strong>${poll.title}</strong>
                            <small>Closed ${formattedExpiry}</small>
                        </span>
                        <i class="fas fa-chart-bar"></i>
                    </a>
                `;
            }

            if (!pollID) {
                showLoading(pollsList, 'Loading closed polls...');

                try {
                    const response = await fetch('/api/polls/expired', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    const createdPolls = Array.isArray(data.created_polls) ? data.created_polls : [];
                    const joinedPolls = Array.isArray(data.joined_polls) ? data.joined_polls : [];

                    pollsList.innerHTML = '';

                    if (createdPolls.length > 0) {
                        pollsList.innerHTML += `
                            <section class="poll-group">
                                <h2>Polls You Created</h2>
                                <div class="poll-list">${createdPolls.map(pollCard).join('')}</div>
                            </section>
                        `;
                    }

                    if (joinedPolls.length > 0) {
                        pollsList.innerHTML += `
                            <section class="poll-group">
                                <h2>Polls You Joined</h2>
                                <div class="poll-list">${joinedPolls.map(pollCard).join('')}</div>
                            </section>
                        `;
                    }

                    if (createdPolls.length === 0 && joinedPolls.length === 0) {
                        pollsList.innerHTML = '<p class="info-message">No closed polls yet.</p>';
                    }
                } catch (error) {
                    pollsList.innerHTML = `<p class="error-message">Failed to load polls: ${error.message || 'Unknown error'}</p>`;
                }
            } else {
                showLoading(resultsContainer, 'Loading tally...');

                try {
                    const response = await fetch(`/api/polls/${pollID}/results`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    document.getElementById('page-title').textContent = data.title || 'Poll Results';
                    pollsList.innerHTML = `
                        <div class="poll-info">
                            <span><i class="fas fa-lock"></i> Closed ${formatDate(data.expires_at)}</span>
                            <span><i class="fas fa-users"></i> ${data.total_votes || 0} total votes</span>
                        </div>
                    `;

                    resultsContainer.innerHTML = '';

                    if (!data.results || data.results.length === 0) {
                        resultsContainer.innerHTML = '<p class="info-message">No votes recorded for this poll.</p>';
                    } else {
                        data.results.forEach((result, index) => {
                            const percentage = data.total_votes > 0
                                ? ((result.vote_count / data.total_votes) * 100).toFixed(1)
                                : 0;

                            const resultItem = document.createElement('div');
                            resultItem.className = 'result-item';
                            resultItem.innerHTML = `
                                <div class="result-row">
                                    <span class="result-rank">${index + 1}</span>
                                    <div>
                                        <strong>${result.text || 'Option'}</strong>
                                        <small>${result.vote_count} votes (${percentage}%)</small>
                                    </div>
                                </div>
                                <div class="result-bar">
                                    <div class="result-fill" style="width: ${percentage}%"></div>
                                </div>
                            `;
                            resultsContainer.appendChild(resultItem);
                        });
                    }
                } catch (error) {
                    resultsContainer.innerHTML = `<p class="error-message">Failed to load results: ${error.message || 'Unknown error'}</p>`;
                }
            }
        });
    </script>
</body>
</html>
