<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votogram - Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/results.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <a href="/home" class="logo-h">
                    <i class="fas fa-vote-yea"></i>
                    Votogram
                </a>
                <div class="auth-links-h">
                    <a href="/profile" style="color: black;">Profile</a>
                    <a href="/results" style="color: black;">Results</a>
                    <a href="/logout" class="btn">Logout</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="results">
            <div class="results-container">
                <p id="page-title">Poll Results</p>
                <div id="polls-list"></div>
                <div id="results-container"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-top">
                <div class="footer-brand">
                    <a href="#" class="logo">
                        <i class="fas fa-vote-yea"></i>
                        Votogram
                    </a>
                    <p>We secure your votes!</p>
                </div>

                <div class="footer-links">
                    <div class="links-column">
                        <h3 class="footer-heading">HELP & INFORMATION</h3>
                        <ul>
                            <li><a href="#">Terms & Condition</a></li>
                            <li><a href="#">Privacy Policy</a></li>
                            <li><a href="#">FAQ</a></li>
                        </ul>
                    </div>

                    <div class="links-column" style="margin-top: 1.7rem;">
                        <h3 class="footer-heading"> </h3>
                        <ul>
                            <li><a href="#">About Us</a></li>
                            <li><a href="#">Help Center</a></li>
                        </ul>
                    </div>

                    <div class="links-column">
                        <h3 class="footer-heading">QUICK LINKS</h3>
                        <ul>
                            <li><a href="#">Home</a></li>
                        </ul>
                    </div>

                    <div class="links-column">
                        <h3 class="footer-heading"> </h3>
                        <ul>
                            <li><a href="#">Contact Us</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="footer-bottom">
                <p>Gyalpozhing College of Information Technology, Kabesa</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const urlParams = new URLSearchParams(window.location.search);
            const pollID = urlParams.get('id');
            const pollsList = document.getElementById('polls-list');
            const resultsContainer = document.getElementById('results-container');

            // Date formatting options for UTC+06:00
            const dateOptions = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZone: 'Asia/Dhaka' // UTC+06:00
            };

            // Show loading state
            function showLoading(element) {
                element.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            }

            // Hide loading state
            function hideLoading(element) {
                const loadingElement = element.querySelector('.loading-spinner');
                if (loadingElement) {
                    loadingElement.remove();
                }
            }

            if (!pollID) {
                // No poll ID provided, show list of expired polls
                showLoading(pollsList);

                try {
                    const response = await fetch('/api/polls/expired', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('Expired polls response:', data); // Debug response

                    // Ensure created_polls and joined_polls are arrays
                    const created_polls = Array.isArray(data.created_polls) ? data.created_polls : [];
                    const joined_polls = Array.isArray(data.joined_polls) ? data.joined_polls : [];

                    pollsList.innerHTML = '';

                    // Display created polls
                    if (created_polls.length > 0) {
                        pollsList.innerHTML += '<h2>Polls You Created</h2>';
                        const createdUl = document.createElement('ul');
                        createdUl.className = 'poll-list';
                        created_polls.forEach(poll => {
                            const expiryDate = new Date(poll.expires_at + 'Z'); // Treat as UTC
                            const formattedExpiry = expiryDate.toLocaleString('en-US', dateOptions);
                            const li = document.createElement('li');
                            li.innerHTML = `<a href="/results?id=${poll.id}" class="poll-link">${poll.title} (Expired: ${formattedExpiry})</a>`;
                            createdUl.appendChild(li);
                        });
                        pollsList.appendChild(createdUl);
                    }

                    // Display joined polls
                    if (joined_polls.length > 0) {
                        pollsList.innerHTML += '<h2>Polls You Joined</h2>';
                        const joinedUl = document.createElement('ul');
                        joinedUl.className = 'poll-list';
                        joined_polls.forEach(poll => {
                            const expiryDate = new Date(poll.expires_at + 'Z'); // Treat as UTC
                            const formattedExpiry = expiryDate.toLocaleString('en-US', dateOptions);
                            const li = document.createElement('li');
                            li.innerHTML = `<a href="/results?id=${poll.id}" class="poll-link">${poll.title} (Expired: ${formattedExpiry})</a>`;
                            joinedUl.appendChild(li);  // Fixed: Appending to joinedUl instead of createdUl
                        });
                        pollsList.appendChild(joinedUl);
                    }

                    if (created_polls.length === 0 && joined_polls.length === 0) {
                        pollsList.innerHTML = '<p class="info-message">No expired polls available.</p>';
                    }
                } catch (error) {
                    console.error('Error fetching expired polls:', error);
                    pollsList.innerHTML = `<p class="error-message">Failed to load polls: ${error.message || 'Unknown error'}</p>`;
                } finally {
                    hideLoading(pollsList);
                }
            } else {
                // Poll ID provided, show results
                showLoading(resultsContainer);

                try {
                    const response = await fetch(`/api/polls/${pollID}/results`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('Poll results response:', data); // Debug response

                    // Update page title and info
                    document.getElementById('page-title').textContent = data.title || 'Poll Results';
                    const expiryDate = new Date(data.expires_at + 'Z'); // Treat as UTC
                    const formattedExpiry = expiryDate.toLocaleString('en-US', dateOptions);
                    pollsList.innerHTML = `<p class="poll-info">Expired on ${formattedExpiry} | Total Votes: ${data.total_votes || 0}</p>`;

                    // Clear previous results
                    resultsContainer.innerHTML = '';

                    // Display results
                    if (!data.results || data.results.length === 0) {
                        resultsContainer.innerHTML = '<p class="info-message">No votes recorded for this poll.</p>';
                    } else {
                        data.results.forEach(result => {
                            const percentage = data.total_votes > 0
                                ? ((result.vote_count / data.total_votes) * 100).toFixed(1)
                                : 0;

                            const resultItem = document.createElement('div');
                            resultItem.className = 'result-item';
                            resultItem.innerHTML = `
                                <p>${result.text || 'Option'}: ${result.vote_count} votes (${percentage}%)</p>
                                <div class="result-bar">
                                    <div class="result-fill" style="width: ${percentage}%"></div>
                                </div>
                            `;
                            resultsContainer.appendChild(resultItem);
                        });
                    }
                } catch (error) {
                    console.error('Error fetching poll results:', error);
                    resultsContainer.innerHTML = `<p class="error-message">Failed to load results: ${error.message || 'Unknown error'}</p>`;
                } finally {
                    hideLoading(resultsContainer);
                }
            }
        });
    </script>
</body>
</html>
